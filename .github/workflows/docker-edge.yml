name: Docker image (edge)

# For testing between releases: every change to main publishes ghcr.io/<owner>/arcanist:edge (and :edge-<commit>),
# for linux/amd64 and linux/arm64. Run it by hand (Actions → Docker image (edge) → Run workflow) to publish another
# tag, such as one for a tester. Releases publish their own tags (release.yml: <version>, preview, latest).

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "native/**"
      - "Dockerfile"
      - ".dockerignore"
      - "Directory.Build.props"
      - "global.json"
      - ".github/workflows/docker-edge.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish besides edge-<commit> (edge by default)"
        required: false
        default: edge

permissions:
  contents: read

concurrency:
  group: docker-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          short="$(git rev-parse --short HEAD)"
          # What the server reports: the project's version, marked as an edge build.
          case "$version" in *-*) echo "value=$version.edge.$GITHUB_RUN_NUMBER" ;; *) echo "value=$version-edge.$GITHUB_RUN_NUMBER" ;; esac >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/arcanist:${{ inputs.tag || 'edge' }}
            ghcr.io/${{ github.repository_owner }}/arcanist:edge-${{ steps.version.outputs.short }}
          labels: |
            org.opencontainers.image.title=Arcanist
            org.opencontainers.image.description=Self-hosted music server (edge build, for testing)
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=edge
          cache-to: type=gha,scope=edge,mode=max
