name: Release

# Pushing a tag such as v0.2.0 tests everything, then publishes:
# - GitHub Release: the Windows installers (x64 and arm64) and Velopack update packages, macOS's Arcanist.app (.dmg,
#   .pkg, .zip and the MacPorts port, Apple Silicon and Intel), the Linux tarballs, the .deb packages, the Synology
#   .spk packages, OpenMediaVault's plugin and the QNAP .qpkg packages (packages.yml builds them all). The Homebrew cask (github.com/linkfast/homebrew-arcanist) follows
#   the releases by itself.
# - ghcr.io/<owner>/arcanist: the Docker image for linux/amd64 and linux/arm64.
# The release is created as a draft and only published once every package is attached.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  TAG: ${{ github.ref_name }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  draft:
    name: Draft release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        # The notes are .github/release-notes.md (which file to download), with a warning on pre-releases; GitHub
        # appends what changed since the previous release.
        run: |
          prerelease=""
          : > notes.md
          case "$VERSION" in *-*)
            prerelease="--prerelease"
            printf '%s\n\n' '> **Pre-release.** Expect rough edges, and keep a backup of what matters to you.' > notes.md
            ;;
          esac
          sed "s/{{VERSION}}/$VERSION/g" .github/release-notes.md >> notes.md
          gh release create "$TAG" --draft --verify-tag --title "Arcanist $VERSION" --notes-file notes.md --generate-notes $prerelease

  packages:
    needs: draft
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.draft.outputs.version }}
      delta: true

  docker:
    name: Docker image
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/arcanist
          # x.y.z, x.y, and `latest` (stable releases only, added by the action); `preview` follows the newest
          # release, pre-releases included (the Compose files use it while there are only pre-releases).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=preview
          labels: |
            org.opencontainers.image.title=Arcanist
            org.opencontainers.image.description=Self-hosted music server
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.draft.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish release
    needs: [packages, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: upload
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: upload
      - uses: actions/download-artifact@v4
        with:
          name: synology
          path: upload
      - uses: actions/download-artifact@v4
        with:
          name: nas
          path: upload
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: upload
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: macports
          path: upload
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l upload
          gh release upload "$TAG" upload/* --repo "${{ github.repository }}" --clobber
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
