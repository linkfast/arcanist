name: Release

# Pushing a tag such as v0.2.0 tests everything, then publishes:
# - GitHub Release: the Windows installer and Velopack update packages, and the Linux tarballs.
# - ghcr.io/<owner>/arcanist: the Docker image for linux/amd64 and linux/arm64.
# The release is created as a draft and only published once every package is attached.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  TAG: ${{ github.ref_name }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  draft:
    name: Draft release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --draft --verify-tag --title "Arcanist $VERSION" --generate-notes $prerelease

  panel:
    name: Admin panel
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0 # keep in sync with mise.toml
          cache: npm
          cache-dependency-path: src/Arcanist.Web/package-lock.json
      - run: sh packaging/build-panel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: panel
          path: src/Arcanist.Web/dist/arcanist-web/browser

  windows:
    name: Windows installer
    needs: [draft, panel]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.draft.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: panel
          path: src/Arcanist.Web/dist/arcanist-web/browser
      - run: dotnet tool restore
      # The previous release lets vpk build a delta package, so updates download only what changed.
      - run: dotnet vpk download github --repoUrl "${{ github.server_url }}/${{ github.repository }}" --token "$env:GH_TOKEN" --outputDir artifacts/windows/releases
        continue-on-error: true
      - run: ./packaging/windows/pack.ps1 -Version $env:VERSION -SkipPanel
      # Only this version's files: the folder also holds the previous full package used for the delta.
      - run: |
          $files = Get-ChildItem artifacts/windows/releases | Where-Object {
              $_.Name -like "*-$env:VERSION-*.nupkg" -or $_.Name -notlike "*.nupkg" } | ForEach-Object FullName
          gh release upload $env:TAG @files --clobber

  linux:
    name: Linux tarballs
    needs: [draft, panel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.draft.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: panel
          path: src/Arcanist.Web/dist/arcanist-web/browser
      # The native audio library is cross-built for glibc 2.27 with Zig.
      - run: pip install cargo-zigbuild ziglang
      - run: sh packaging/linux/pack.sh "$VERSION" --skip-panel
      - run: gh release upload "$TAG" artifacts/linux/*.tar.gz --clobber

  docker:
    name: Docker image
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/arcanist
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Arcanist
            org.opencontainers.image.description=Self-hosted music server
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.draft.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish release
    needs: [windows, linux, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
