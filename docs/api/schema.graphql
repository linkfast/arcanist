type Query {
  "Progress of the background audio analysis (loudness, fingerprints, waveforms, tempo and key). Requires MANAGE_LIBRARIES."
  analysisProgress: AnalysisProgress!
  "The user's app passwords, for Subsonic and mStream apps; their secrets are never shown again."
  appPasswords: [AppPassword!]!
  "Where backups go: folders of this server, S3 buckets and other Arcanist servers. Administrators only."
  backupDestinations: [BackupDestinationInfo!]!
  "The backups of the server, its libraries, albums or playlists, with their latest run. Administrators only."
  backups: [BackupDefinition!]!
  "A backup, with its latest run. Administrators only."
  backup(id: ID!): BackupDefinition!
  "The 20 latest runs of a backup. Administrators only."
  backupRuns(backupId: ID!): [BackupJob!]!
  "Other Arcanist servers that keep their backups here, with the space they take. Administrators only."
  backupGuests: [BackupGuest!]!
  "A run of a backup and how far it got. Administrators only."
  backupRun(id: ID!): BackupJob!
  "Performers and album artists with music the user can play, by name; optionally only those with music in a library. Pages of `first` items (default 50, at most 500) after the `after` cursor."
  artists(search: String, after: String, first: Int, libraryId: ID): ArtistPage!
  artist(id: ID!): Artist!
  "Albums with music the user can play, by title; optionally only those of an artist, or with music in a library."
  albums(search: String, artistId: ID, after: String, first: Int, libraryId: ID): AlbumPage!
  album(id: ID!): Album!
  "Tracks the user can play, by title; optionally only those with a copy in a library. With albumId, all of the album's tracks in disc and track order, without paging."
  tracks(search: String, albumId: ID, artistId: ID, after: String, first: Int, libraryId: ID): TrackPage!
  "Finds the server's tracks for an app's own (at most 1000 per call): by audio hash, MusicBrainz recording, AcoustID, and last by title, artist and album."
  matchTracks(input: MatchTracksInput!): [TrackMatch!]!
  track(id: ID!): Track!
  "A track's lyrics, with synchronized lines when known. not_found when it has none."
  trackLyrics(trackId: ID!): TrackLyrics!
  "Overview of a track's audio for seek bars, from its best copy or the given file. not_found until the copy is analyzed."
  trackWaveform(trackId: ID!, fileId: ID): Waveform!
  "The server's database, the last migration and the SQLite file it left. Administrators only."
  database: DatabaseStatus!
  "The user's home page: recently played and added albums, mixes, most played, starred tracks, albums to rediscover or never played, and playlists. Empty sections are left out."
  home: Home!
  "Mixes made for the user from their favorite artists, genres and decades, their favorites and music they never played. They change once a day."
  mixes: [Mix!]!
  "A mix's tracks in play order. Besides the ids from mixes, any artist:<id>, genre:<id>, decade:<year> or track:<id> (a radio started from a track) works, ids without dashes."
  mix(id: String!): MixTracks!
  "Everything an artist page shows: top tracks, albums, albums the artist appears on, related artists and the artist's mix."
  artistOverview(id: ID!): ArtistOverview!
  "Searches the local networks for DLNA/UPnP media servers for a few seconds. Administrators only."
  dlnaMediaServers: [DlnaMediaServer!]!
  "The media server at a description URL, for servers the search does not find. Administrators only."
  dlnaMediaServer(location: String!): DlnaMediaServer!
  "A folder of a media server (0 or none is the root): its subfolders and how much music it holds. Administrators only."
  browseDlnaMediaServer(location: String!, folderId: String): DlnaFolderContents!
  "The latest copies from media servers and how far they got. Administrators only."
  dlnaImports: [DlnaImportJob!]!
  "The DLNA media server: whether it is on, what it publishes and the addresses devices find. Administrators only."
  dlna: DlnaStatus!
  "Devices on the local network Arcanist can play to (DLNA renderers); empty while DLNA is off."
  dlnaRenderers: [DlnaRenderer!]!
  "What a renderer is doing: its state, position, volume and Arcanist's queue on it."
  dlnaRenderer(id: String!): DlnaRendererState!
  "Pairs of tracks whose audio is similar but not enough to merge them automatically, most similar first. Open ones by default, or DISMISSED. Requires MANAGE_LIBRARIES."
  duplicateCandidates(status: DuplicateStatus, first: Int): [DuplicatePair!]!
  "Built-in and installed extensions, with what happened to them at startup. Administrators only."
  extensions: [Extension!]!
  "Installed web players; the default one is served at /. Administrators only."
  frontends: [Frontend!]!
  "Libraries the signed-in user can access."
  libraries: [Library!]!
  "A library by id. Libraries the user cannot access are reported as not found."
  library(id: ID!): Library!
  "Library folder moves since the server started, the latest first, with their progress. Administrators only."
  librarySourceMoves: [LibrarySourceMove!]!
  "Folders on the server, for choosing library locations. Lists the file system roots when path is omitted. Administrators only."
  serverDirectories(path: String): ServerDirectoryListing!
  "The user's StarTracks (the star in single-star mode, five stars otherwise), most recently starred first, with each song's AcoustID."
  starTracks(after: String, first: Int): StarTrackPage!
  "The user's tracks rated at least minRating (5 for StarTracks), most recently rated first. With the single-star rating mode, only StarTracks."
  ratedTracks(minRating: Int, after: String, first: Int): RatedTrackPage!
  "The user's counted plays, newest first."
  playHistory(after: String, first: Int): PlayHistoryPage!
  "Listening over a period: the user's own, or another user's with VIEW_ALL_STATS. timeZone is an IANA id (UTC by default) for days and months."
  listeningStats(period: StatsPeriod!, timeZone: String, userId: ID): ListeningStats!
  "What the libraries hold and how the server is listened to, per user. Requires VIEW_ALL_STATS."
  serverStats(period: StatsPeriod!, timeZone: String): ServerStats!
  "Where Arcanist found ffmpeg, and the progress of a download. Requires MANAGE_SETTINGS."
  ffmpeg: FfmpegStatus!
  "The latest imports from mStream, newest first. Administrators only."
  mstreamImports: [MstreamImportJob!]!
  "How the mStream extension behaves with the mStream apps: the star threshold, signing in with the user's password and the apps' own functions. Administrators only."
  mstream: MstreamStatus!
  "Which online services are on (MusicBrainz, AcoustID, Cover Art Archive, LRCLib) and what each has done. Requires MANAGE_SETTINGS."
  onlineServices: OnlineServicesStatus!
  "What organizing the library would move, with the given template or the library's own. Requires MANAGE_LIBRARIES."
  organizePreview(libraryId: ID!, template: String): OrganizePreview!
  "The library's latest organizing runs, newest first. Requires MANAGE_LIBRARIES."
  organizeRuns(libraryId: ID!): [OrganizeRun!]!
  "Folders whose files are imported into libraries. Administrators only."
  dropFolders: [DropFolder!]!
  "Files found in drop folders, most recently changed first: in the given state, or else those still in a drop folder. Requires MANAGE_LIBRARIES."
  importItems(status: ImportStatus, dropFolderId: ID, first: Int): [ImportItem!]!
  "How many files of the drop folders are in each state. Requires MANAGE_LIBRARIES."
  importSummary: ImportSummary!
  "The P2P network: whether it runs, this server's node id, its relay and what goes through it now. Administrators only."
  p2pStatus: P2PStatus!
  "Nodes allowed through the P2P network, with their rules and traffic: the caller's devices, or every peer for administrators."
  networkPeers(kind: P2PPeerKind): [NetworkPeer!]!
  "Libraries other servers share with this one, each shown here as a library. Administrators only."
  receivedShares: [ReceivedShare!]!
  "What happened in the P2P network, newest first: pairings, connections, streams, refusals and revocations. Administrators only."
  p2pActivity(peerId: ID, limit: Int): [P2PActivityEntry!]!
  "The user's playlists, those they collaborate on and public ones, most recently changed first."
  playlists: [Playlist!]!
  "A playlist by id. Playlists the user cannot see are reported as not found."
  playlist(id: ID!): Playlist!
  "A playlist's tracks in order, page by page (100 by default, at most 1000)."
  playlistEntries(playlistId: ID!, after: String, first: Int): PlaylistEntryPage!
  "The server's other active users, to invite as playlist collaborators."
  shareableUsers: [UserReference!]!
  "Most recent scans first, of one library or of all libraries the user can see. Requires RUN_SCANS or MANAGE_LIBRARIES."
  scanJobs(libraryId: ID, limit: Int): [ScanJob!]!
  "A scan by id, including live progress while it runs. Requires RUN_SCANS or MANAGE_LIBRARIES."
  scanJob(id: ID!): ScanJob!
  "Artists, albums, tracks and playlists matching every word of the query (as word starts, ignoring accents and case), best first. first is per kind: 10 by default, at most 50."
  search(query: String!, first: Int): SearchResults!
  "What the setup wizard chose, as it is now, to run it again. Administrators only."
  serverConfiguration: ServerConfiguration!
  "No telemetry, and which outside services the server may use. Requires MANAGE_SETTINGS."
  privacy: Privacy!
  "Whether anonymous play counts go to Ultimate Cloud's global statistics. Requires MANAGE_SETTINGS."
  anonymousStatistics: Boolean!
  "The linked Ultimate Cloud account, its plan and what it enables. Administrators only."
  ultimateCloud: UltimateCloudStatus!
  "The Ultimate Cloud accounts linked to this server, for choosing where uploads go. Administrators only."
  ultimateCloudAccounts: [LinkedCloudAccount!]!
  "The linked account's listening statistics as Ultimate Cloud counts them. Administrators only."
  ultimateCloudMetrics: UltimateCloudMetrics!
  "The caller's own Ultimate Cloud account and what it brings them: their music as a personal library, their plays, statistics, StarTracks and devices."
  myUltimateCloud: MyUltimateCloudStatus!
  "The caller's own account's listening statistics as Ultimate Cloud counts them."
  myUltimateCloudMetrics: UltimateCloudMetrics!
  "How each library with folders on this server syncs with the Ultimate Cloud account. Administrators only."
  cloudSyncs: [LibraryCloudSyncState!]!
  "Public description of the server. Does not require authentication."
  serverInfo: ServerInfo!
  "The signed-in user."
  me: UserAccount!
  "Devices where the signed-in user is currently signed in."
  mySessions: [Session!]!
  "All users. Requires the MANAGE_USERS permission."
  users: [UserAccount!]!
  "A user by id. Requires the MANAGE_USERS permission."
  user(id: ID!): UserAccount!
}

