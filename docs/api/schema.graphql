  playerMarketplace(language: String, refresh: Boolean): PlayerMarketplaceInfo!
  "Libraries the signed-in user can access. With `includeVirtual`, first \"All\" (`virtual`), every one of them at once, named in `language` (or the request's Accept-Language)."
  libraries(includeVirtual: Boolean, language: String): [Library!]!
  "A library by id. Libraries the user cannot access are reported as not found."
  library(id: ID!, language: String): Library!
  "Library folder moves since the server started, the latest first, with their progress. Administrators only."
  librarySourceMoves: [LibrarySourceMove!]!
  "Folders on the server, for choosing library locations. Lists the file system roots when path is omitted. Administrators only."
  serverDirectories(path: String): ServerDirectoryListing!
  "The user's StarTracks (the star in single-star mode, five stars otherwise), most recently starred first, with each song's AcoustID."
  starTracks(after: String, first: Int): StarTrackPage!
  "The user's tracks rated at least minRating (5 for StarTracks), most recently rated first. With the single-star rating mode, only StarTracks."
  ratedTracks(minRating: Int, after: String, first: Int): RatedTrackPage!
  "The user's counted plays, newest first."
  playHistory(after: String, first: Int): PlayHistoryPage!
  "Listening over a period: the user's own, or another user's with VIEW_ALL_STATS. timeZone is an IANA id (UTC by default) for days and months."
  listeningStats(period: StatsPeriod!, timeZone: String, userId: ID, libraryId: ID): ListeningStats!
  "What the libraries hold and how the server is listened to, per user; with libraryId, of one library. Requires VIEW_ALL_STATS."
  serverStats(period: StatsPeriod!, timeZone: String, libraryId: ID): ServerStats!
  "Each library the user sees at a glance: songs, albums, files, size and length, and with VIEW_ALL_STATS its plays and listeners of the last 30 days."
  librarySummaries: [LibrarySummary!]!
  "How many songs have lyrics, how many of them are timed (and how many timed on this server), how many plain lyrics could be timed here, and whether the official extension that does it (Lyrics Sync) is installed and running. Administrators only."
  lyricsTiming: LyricsTimingStatus!
