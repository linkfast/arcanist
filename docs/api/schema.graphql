type Query {
  "Progress of the background audio analysis (loudness, fingerprints, waveforms, tempo and key). Requires MANAGE_LIBRARIES."
  analysisProgress: AnalysisProgress!
  "Performers and album artists with music the user can play, by name. Pages of `first` items (default 50, at most 500) after the `after` cursor."
  artists(search: String, after: String, first: Int): ArtistPage!
  artist(id: ID!): Artist!
  "Albums with music the user can play, by title; optionally only those of an artist."
  albums(search: String, artistId: ID, after: String, first: Int): AlbumPage!
  album(id: ID!): Album!
  "Tracks the user can play, by title. With albumId, all of the album's tracks in disc and track order, without paging."
  tracks(search: String, albumId: ID, artistId: ID, after: String, first: Int): TrackPage!
  track(id: ID!): Track!
  "A track's lyrics, with synchronized lines when known. not_found when it has none."
  trackLyrics(trackId: ID!): TrackLyrics!
  "Overview of a track's audio for seek bars, from its best copy or the given file. not_found until the copy is analyzed."
  trackWaveform(trackId: ID!, fileId: ID): Waveform!
  "Pairs of tracks whose audio is similar but not enough to merge them automatically, most similar first. Open ones by default, or DISMISSED. Requires MANAGE_LIBRARIES."
  duplicateCandidates(status: DuplicateStatus, first: Int): [DuplicatePair!]!
  "Libraries the signed-in user can access."
  libraries: [Library!]!
  "A library by id. Libraries the user cannot access are reported as not found."
  library(id: ID!): Library!
  "Folders on the server, for choosing library locations. Lists the file system roots when path is omitted. Administrators only."
  serverDirectories(path: String): ServerDirectoryListing!
  "Where Arcanist found ffmpeg, and the progress of a download. Requires MANAGE_SETTINGS."
  ffmpeg: FfmpegStatus!
  "Which online services are on (MusicBrainz, AcoustID, Cover Art Archive, LRCLib) and what each has done. Requires MANAGE_SETTINGS."
  onlineServices: OnlineServicesStatus!
  "Most recent scans first, of one library or of all libraries the user can see. Requires RUN_SCANS or MANAGE_LIBRARIES."
  scanJobs(libraryId: ID, limit: Int): [ScanJob!]!
  "A scan by id, including live progress while it runs. Requires RUN_SCANS or MANAGE_LIBRARIES."
  scanJob(id: ID!): ScanJob!
  "Public description of the server. Does not require authentication."
  serverInfo: ServerInfo!
  "The signed-in user."
  me: UserAccount!
  "Devices where the signed-in user is currently signed in."
  mySessions: [Session!]!
  "All users. Requires the MANAGE_USERS permission."
  users: [UserAccount!]!
  "A user by id. Requires the MANAGE_USERS permission."
  user(id: ID!): UserAccount!
}

type AnalysisProgress {
  activity: AnalysisActivity!
  enabled: Boolean!
  pending: Int!
  analyzed: Int!
  needsFfmpeg: Int!
  failed: Int!
  filesPerMinute: Float!
  lastAnalyzedAt: DateTime
  error: String
}

enum AnalysisActivity {
  DISABLED
  UNAVAILABLE
  IDLE
  WAITING_FOR_SCAN
  RUNNING
}

"The `DateTime` scalar type represents a date and time. `DateTime` expects timestamps to be formatted in accordance with the [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) standard."
scalar DateTime

type ArtistPage {
  items: [Artist!]!
  nextCursor: String
  totalCount: Int!
}

type Artist {
  id: ID!
  name: String!
  sortName: String
  musicBrainzId: ID
}

type AlbumPage {
  items: [Album!]!
  nextCursor: String
  totalCount: Int!
}

type Album {
  id: ID!
  title: String!
  artist: ArtistReference!
  year: Int
  isCompilation: Boolean!
  musicBrainzId: ID
  artworkId: ID
  trackCount: Int!
  durationMs: Long!
}

type ArtistReference {
  id: ID!
  name: String!
}

scalar Long

type TrackPage {
  items: [Track!]!
  nextCursor: String
  totalCount: Int!
}

type Track {
  id: ID!
  title: String!
  album: AlbumReference!
  artists: [ArtistCredit!]!
  discNumber: Int
  trackNumber: Int
  durationMs: Int!
  artworkId: ID
  genres: [String!]!
  addedAt: DateTime!
  bpm: Float
  key: MusicalKey
  hasLyrics: Boolean!
  files: [TrackFile!]!
  streamUrl: String!
}

type AlbumReference {
  id: ID!
  title: String!
}

type ArtistCredit {
  artistId: ID!
  name: String!
  role: ArtistRole!
}

enum ArtistRole {
  PRIMARY
  FEATURED
  COMPOSER
  CONDUCTOR
  REMIXER
  LYRICIST
  PRODUCER
}

type MusicalKey {
  tonic: Int!
  mode: KeyMode!
  notation: String!
  camelot: String!
  confidence: Float!
}

enum KeyMode {
  MAJOR
  MINOR
}

type TrackFile {
  id: ID!
  format: String
  bitRate: Int
  sampleRate: Int
  bitDepth: Int
  channels: Int
  size: Long!
  durationMs: Int!
  replayGainTrackGain: Float
  replayGainAlbumGain: Float
  loudness: Loudness
  streamUrl: String!
}

type Loudness {
  integrated: Float!
  range: Float!
  truePeak: Float!
  trackGain: Float!
  albumGain: Float
  albumPeak: Float
}

type TrackLyrics {
  trackId: ID!
  plain: String
  synced: [LyricsLine!]
  source: LyricsSource!
  instrumental: Boolean!
}

type LyricsLine {
  timeMs: Int!
  text: String!
}

enum LyricsSource {
  SIDECAR
  EMBEDDED
  ONLINE
}

type Waveform {
  trackId: ID!
  fileId: ID!
  durationMs: Int!
  peaks: [Int!]!
}

type DuplicatePair {
  id: ID!
  trackA: Track!
  trackB: Track!
  similarity: Float!
  status: DuplicateStatus!
  detectedAt: DateTime!
}

enum DuplicateStatus {
  OPEN
  MERGED
  DISMISSED
}

type Library {
  id: ID!
  name: String!
  visibleToAll: Boolean!
  scanIntervalHours: Int
  createdAt: DateTime!
  lastScanAt: DateTime
  sources: [LibrarySource!]
}

type LibrarySource {
  id: ID!
  kind: LibrarySourceKind!
  location: String!
}

enum LibrarySourceKind {
  LOCAL
}

type ServerDirectoryListing {
  path: String
  parent: String
  directories: [ServerDirectory!]!
}

type ServerDirectory {
  name: String!
  path: String!
  isHidden: Boolean!
}

type FfmpegStatus {
  available: Boolean!
  path: String
  version: String
  source: FfmpegSource
  configuredPath: String
  configuredPathWorks: Boolean!
  canDownload: Boolean!
  download: FfmpegDownloadProgress!
}

enum FfmpegSource {
  CONFIGURED
  DOWNLOADED
  SYSTEM
}

type FfmpegDownloadProgress {
  state: FfmpegDownloadState!
  bytesReceived: Long!
  totalBytes: Long
  version: String
  error: String
}

enum FfmpegDownloadState {
  IDLE
  DOWNLOADING
  INSTALLING
  COMPLETED
  FAILED
}

type OnlineServicesStatus {
  settings: OnlineServicesSettings!
  hasAcoustIdKey: Boolean!
  hasOwnAcoustIdKey: Boolean!
  services: [OnlineServiceStatus!]!
}

type OnlineServicesSettings {
  musicBrainz: Boolean!
  acoustId: Boolean!
  coverArtArchive: Boolean!
  lyrics: Boolean!
  isEnabled(service: OnlineService!): Boolean!
}

enum OnlineService {
  MUSIC_BRAINZ
  ACOUST_ID
  COVER_ART_ARCHIVE
  LYRICS
}

type OnlineServiceStatus {
  service: OnlineService!
  enabled: Boolean!
  ready: Boolean!
  pending: Int!
  found: Int!
  notFound: Int!
  failed: Int!
  lastRequestAt: DateTime
  lastError: String
}

type ScanJob {
  id: ID!
  libraryId: ID!
  kind: ScanKind!
  status: ScanStatus!
  requestedAt: DateTime!
  startedAt: DateTime
  finishedAt: DateTime
  filesSeen: Int!
  filesAdded: Int!
  filesUpdated: Int!
  filesMissing: Int!
  errors: Int!
  errorCode: String
  progress: ScanProgress
}

enum ScanKind {
  INCREMENTAL
  FULL
}

enum ScanStatus {
  QUEUED
  RUNNING
  COMPLETED
  CANCELLED
  FAILED
}

type ScanProgress {
  phase: ScanPhase!
  filesFound: Int!
  filesToRead: Int!
  filesRead: Int!
}

enum ScanPhase {
  DISCOVERING
  READING
  CLEANING_UP
}

type ServerInfo {
  name: String!
  version: String!
  apiVersion: Int!
  sourceUrl: String
  setupCompleted: Boolean!
  capabilities: [Capability!]!
  cloudTier: CloudTier!
  transcodingFormats: [TranscodeFormat!]!
}

enum Capability {
  ULTIMATE_CLOUD_SOURCE
  CLOUD_SYNC
  THIRD_PARTY_STORAGE
  CLOUD_CONNECT
}

enum CloudTier {
  NONE
  FREE
  PAID
}

enum TranscodeFormat {
  OPUS
  MP_3
  AAC
}

type UserAccount {
  id: ID!
  userName: String!
  displayName: String
  role: UserRole!
  permissions: [Permission!]!
  isDisabled: Boolean!
  createdAt: DateTime!
  lastLoginAt: DateTime
  libraryIds: [ID!]!
}

enum UserRole {
  USER
  ADMIN
}

enum Permission {
  MANAGE_LIBRARIES
  MANAGE_USERS
  MANAGE_SETTINGS
  RUN_SCANS
  DOWNLOAD
  VIEW_ALL_STATS
}

type Session {
  id: ID!
  deviceName: String
  userAgent: String
  ipAddress: String
  createdAt: DateTime!
  lastSeenAt: DateTime!
  expiresAt: DateTime!
  isCurrent: Boolean!
}

type Mutation {
  "Turns the background audio analysis on or off. Requires MANAGE_SETTINGS."
  setAnalysisEnabled(enabled: Boolean!): AnalysisProgress!
  "Merges an open pair into keepTrackId, one of its two tracks, and returns it. Requires MANAGE_LIBRARIES."
  mergeDuplicate(id: ID!, keepTrackId: ID!): Track!
  "Keeps the two tracks of an open pair apart; it is not proposed again. Requires MANAGE_LIBRARIES."
  dismissDuplicate(id: ID!): Boolean!
  "Requires MANAGE_LIBRARIES."
  createLibrary(input: CreateLibraryInput!): Library!
  "Requires MANAGE_LIBRARIES."
  updateLibrary(id: ID!, input: UpdateLibraryInput!): Library!
  "Removes the library and its tracks from the catalog; files on disk are not touched. Requires MANAGE_LIBRARIES and a recent authentication."
  deleteLibrary(id: ID!): Boolean!
  "Adds a location to a library. Requires MANAGE_LIBRARIES."
  addLibrarySource(libraryId: ID!, input: LibrarySourceInput!): Library!
  "Removes a location and its tracks from the catalog; files on disk are not touched. Requires MANAGE_LIBRARIES."
  removeLibrarySource(id: ID!): Library!
  "Uses the ffmpeg at the given path, or finds one automatically when null. Fails with not_ffmpeg if it does not work. Administrators only, with a recent password."
  setFfmpegPath(path: String): FfmpegStatus!
  "Downloads ffmpeg (a static GPL build from BtbN/FFmpeg-Builds) into the data directory in the background. Administrators only, with a recent password."
  installFfmpeg: FfmpegStatus!
  "Turns online services on or off. They send only fingerprints, identifiers and artist, album and track names. Requires MANAGE_SETTINGS."
  setOnlineServices(input: SetOnlineServicesInput!): OnlineServicesStatus!
  "Uses your own AcoustID application key instead of the project's; null or empty goes back to the project's. Requires MANAGE_SETTINGS."
  setAcoustIdKey(input: SetAcoustIdKeyInput!): OnlineServicesStatus!
  "Queues a scan, or returns the one already queued or running for the library. A full scan re-reads every file. Requires RUN_SCANS."
  startScan(libraryId: ID!, full: Boolean!): ScanJob!
  "Requires RUN_SCANS."
  cancelScan(id: ID!): Boolean!
  "Requires MANAGE_USERS and a recent authentication."
  createUser(input: CreateUserInput!): UserAccount!
  "Requires MANAGE_USERS and a recent authentication."
  updateUser(id: ID!, input: UpdateUserInput!): UserAccount!
  "Replaces the libraries explicitly granted to a user. Requires MANAGE_USERS and a recent authentication."
  setUserLibraries(id: ID!, input: SetUserLibrariesInput!): UserAccount!
  "Sets a new password and signs the user out everywhere. Requires MANAGE_USERS and a recent authentication."
  resetUserPassword(id: ID!, input: ResetUserPasswordInput!): Boolean!
  "Requires MANAGE_USERS and a recent authentication."
  deleteUser(id: ID!): Boolean!
  "Changes the signed-in user's password and signs out their other devices."
  changeMyPassword(input: ChangeMyPasswordInput!): Boolean!
  "Signs out one of the signed-in user's devices."
  revokeMySession(id: ID!): Boolean!
}

input CreateLibraryInput {
  name: String!
  visibleToAll: Boolean!
  scanIntervalHours: Int
  sources: [LibrarySourceInput!]!
}

input LibrarySourceInput {
  location: String!
}

input UpdateLibraryInput {
  name: String!
  visibleToAll: Boolean!
  scanIntervalHours: Int
}

input SetOnlineServicesInput {
  musicBrainz: Boolean!
  acoustId: Boolean!
  coverArtArchive: Boolean!
  lyrics: Boolean!
}

input SetAcoustIdKeyInput {
  key: String
}

input CreateUserInput {
  userName: String!
  password: String!
  displayName: String
  role: UserRole!
  permissions: [Permission!]
  libraryIds: [ID!]
}

input UpdateUserInput {
  displayName: String
  role: UserRole!
  permissions: [Permission!]
  isDisabled: Boolean!
}

input SetUserLibrariesInput {
  libraryIds: [ID!]!
}

input ResetUserPasswordInput {
  newPassword: String!
}

input ChangeMyPasswordInput {
  currentPassword: String!
  newPassword: String!
}

type Subscription {
  "Progress of the background audio analysis, at most once a second. Requires MANAGE_LIBRARIES."
  analysisProgressChanged: AnalysisProgress!
  "Changes of scans of one library, or of all the user can see: status changes immediately, progress at most twice a second. Requires RUN_SCANS or MANAGE_LIBRARIES."
  scanJobUpdated(libraryId: ID): ScanJob!
}
