type TrackAnalysisResult {
  trackId: ID!
  status: TrackAnalysisStatus!
  stale: Boolean!
  position: Int
  errorCode: String
  contentHash: String
  analysisVersion: Int
  analyzedAt: DateTime
  durationSeconds: Float
  musicStart: Float
  musicEnd: Float
  tempo: AnalysisTempo
  phrases: [AnalysisPhrase!]
  loudness: AnalysisLoudness
  key: AnalysisKey
  energy: AnalysisEnergy
  vocals: AnalysisVocals
  onsets: AnalysisOnsets
  silences: [AnalysisSilence!]
  fades: AnalysisFades
  sections: [AnalysisSection!]
  highlight: AnalysisHighlight
  mixPoints: AnalysisMixPoints
  scratchCues: [AnalysisScratchCue!]
  stats: TrackListeningStats
}

enum TrackAnalysisStatus {
  READY
  PENDING
  FAILED
}

"The `DateTime` scalar type represents a date and time. `DateTime` expects timestamps to be formatted in accordance with the [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) standard."
scalar DateTime

type AnalysisTempo {
  bpm: Float!
  confidence: Float!
  stable: Boolean!
  beatsPerBar: Int!
  firstBeat: Float
  firstDownbeat: Float
  beats: String
  downbeats: String
}

type AnalysisPhrase {
  start: Float!
  bars: Int!
}

type AnalysisLoudness {
  integratedLufs: Float!
  range: Float!
  truePeakDb: Float!
}

type AnalysisKey {
  tonic: String!
  mode: String!
  camelot: String!
  confidence: Float!
}

type AnalysisEnergy {
  stepSeconds: Float!
  values: String!
}

type AnalysisVocals {
  stepSeconds: Float!
  presence: String!
}

type AnalysisOnsets {
  times: String!
  strengths: String!
}

type AnalysisSilence {
  start: Float!
  end: Float!
  kind: String!
}

type AnalysisFades {
  fadeInEnd: Float
  fadeOutStart: Float
}

type AnalysisSection {
  start: Float!
  end: Float!
  label: String!
  name: String!
  energy: Float!
  trend: String!
  occurrence: Int!
}

type AnalysisHighlight {
  start: Float!
  end: Float!
  confidence: Float!
}

type AnalysisMixPoints {
  introEnd: Float!
  outroStart: Float!
  mixIn: [Float!]!
  mixOut: [Float!]!
}

type AnalysisScratchCue {
  t: Float!
  duration: Float!
  kind: String!
  isolation: Float!
  strength: Float!
}

type TrackListeningStats {
  trackId: ID!
  plays: Int!
  skips: Int!
  avgSkipPosition: Float
  completions: Int!
  avgListenRatio: Float
  lastPlayedAt: DateTime
  hourHistogram: [Int!]!
}

type TrackAnalysisPage {
  items: [TrackAnalysisResult!]!
  nextCursor: String
}

type TrackStatsPage {
  items: [TrackListeningStats!]!
  nextCursor: String
}

enum TrackStatsScope {
  ME
  SERVER
}

type AiStatus {
  enabled: Boolean!
  activity: AiActivity!
  progress: TrackAnalysisProgress!
  songsPerMinute: Float!
  lastAnalyzedAt: DateTime
  error: String
  settings: AiSettingsModel!
  maxThreads: Int!
}

enum AiActivity {
  DISABLED
  UNAVAILABLE
  IDLE
  PAUSED
  RUNNING
}

type TrackAnalysisProgress {
  analysisVersion: Int!
  analyzed: Int!
  pending: Int!
  failed: Int!
}

type AiSettingsModel {
  threads: Int!
  pauseWhileScanning: Boolean!
  pauseWhileStreaming: Boolean!
  onDemandSources: Boolean!
  shareServerStats: Boolean!
}

type AnalysisProgress {
  activity: AnalysisActivity!
  enabled: Boolean!
  pending: Int!
  analyzed: Int!
  needsFfmpeg: Int!
  failed: Int!
  filesPerMinute: Float!
  lastAnalyzedAt: DateTime
  error: String
}

enum AnalysisActivity {
  DISABLED
  UNAVAILABLE
  IDLE
  WAITING_FOR_SCAN
  RUNNING
}

type AppPassword {
  id: ID!
  name: String!
  createdAt: DateTime!
  lastUsedAt: DateTime
}

type BackupDestinationInfo {
  id: ID!
  name: String!
  kind: BackupDestinationKind!
  location: String!
  backups: Int!
  createdAt: DateTime!
}

enum BackupDestinationKind {
  FOLDER
  S3
  PEER
}

type BackupDefinition {
  id: ID!
  name: String!
  destination: BackupDestinationInfo!
  scope: BackupScope!
  items: [BackupScopeItem!]!
  includeUserData: Boolean!
  includeServer: Boolean!
  schedule: BackupSchedule!
  intervalHours: Int
  timeOfDay: Int
  dayOfWeek: DayOfWeek
  timeZone: String!
  retentionDays: Int!
  enabled: Boolean!
  folder: String!
  createdAt: DateTime!
  nextRunAt: DateTime
  lastRun: BackupJob
}

enum BackupScope {
  SERVER
  LIBRARY
  ALBUM
  PLAYLIST
}

type BackupScopeItem {
  id: ID!
  name: String!
}

enum BackupSchedule {
  MANUAL
  HOURS
  DAILY
  WEEKLY
}

enum DayOfWeek {
  SUNDAY
  MONDAY
  TUESDAY
  WEDNESDAY
  THURSDAY
  FRIDAY
  SATURDAY
}

type BackupJob {
  id: ID!
  backupId: ID!
  backupName: String!
  status: BackupRunStatus!
  trigger: BackupTrigger!
  snapshot: String
  requestedAt: DateTime!
  startedAt: DateTime
  finishedAt: DateTime
  files: Int!
  copied: Int!
  unchanged: Int!
  versioned: Int!
  skipped: Int!
  failed: Int!
  bytes: Long!
  errorCode: String
  failures: [BackupJobFailure!]!
}

enum BackupRunStatus {
  QUEUED
  RUNNING
  COMPLETED
  COMPLETED_WITH_ERRORS
  FAILED
  CANCELLED
}

enum BackupTrigger {
  MANUAL
  SCHEDULED
}

