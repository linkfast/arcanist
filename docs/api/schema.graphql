  mergeDuplicate(id: ID!, keepTrackId: ID!): Track!
  "Keeps the two tracks of an open pair apart; it is not proposed again. Requires MANAGE_LIBRARIES."
  dismissDuplicate(id: ID!): Boolean!
  "Requires MANAGE_LIBRARIES."
  createLibrary(input: CreateLibraryInput!): Library!
  "Requires MANAGE_LIBRARIES."
  updateLibrary(id: ID!, input: UpdateLibraryInput!): Library!
  "Removes the library and its tracks from the catalog; files on disk are not touched. Requires MANAGE_LIBRARIES and a recent authentication."
  deleteLibrary(id: ID!): Boolean!
  "Adds a location to a library. Requires MANAGE_LIBRARIES."
  addLibrarySource(libraryId: ID!, input: LibrarySourceInput!): Library!
  "Creates a folder on the server, to pick it as a location. Administrators only."
  createServerDirectory(input: CreateServerDirectoryInput!): ServerDirectory!
  "Removes a location and its tracks from the catalog; files on disk are not touched. Requires MANAGE_LIBRARIES."
  removeLibrarySource(id: ID!): Library!
  "Rates a track 1–5 for the user, or clears the rating with null. With the single-star rating mode only 5 is accepted."
  rateTrack(trackId: ID!, rating: Int): Track!
  "Stars a track for the user (rates it 5) or unstars it (clears a 5). Works with both rating modes."
  starTrack(trackId: ID!, starred: Boolean!): Track!
  "Reports that the user listened to a track. The server decides whether it counts as a play (30 seconds, and half the track or four minutes) or a skip."
  recordPlay(input: RecordPlayInput!): RecordedPlay!
  "Chooses how users rate tracks: STARS (one to five) or STAR (a single star, kept as five). Nothing is lost when switching. Requires MANAGE_SETTINGS."
  setRatingMode(mode: RatingMode!): RatingMode!
  "Uses the ffmpeg at the given path, or finds one automatically when null. Fails with not_ffmpeg if it does not work. Administrators only, with a recent password."
  setFfmpegPath(path: String): FfmpegStatus!
  "Downloads ffmpeg (a static GPL build from BtbN/FFmpeg-Builds) into the data directory in the background. Administrators only, with a recent password."
  installFfmpeg: FfmpegStatus!
  "Turns online services on or off. They send only fingerprints, identifiers and artist, album and track names. Requires MANAGE_SETTINGS."
  setOnlineServices(input: SetOnlineServicesInput!): OnlineServicesStatus!
  "Uses your own AcoustID application key instead of the project's; null or empty goes back to the project's. Requires MANAGE_SETTINGS."
  setAcoustIdKey(input: SetAcoustIdKeyInput!): OnlineServicesStatus!
  "Sets the library's path template and whether files added to it are organized automatically. Requires MANAGE_LIBRARIES."
  updateLibraryOrganization(libraryId: ID!, input: UpdateLibraryOrganizationInput!): Library!
  "Moves the library's files to the paths its template gives them, in the background. Requires MANAGE_LIBRARIES and a recent authentication."
  organizeLibrary(libraryId: ID!): OrganizeRun!
  "Moves the files of a finished organizing run back where they were, in the background. Requires MANAGE_LIBRARIES and a recent authentication."
  undoOrganizeRun(id: ID!): OrganizeRun!
  "Administrators only."
  createDropFolder(input: DropFolderInput!): DropFolder!
  "Administrators only."
  updateDropFolder(id: ID!, input: DropFolderInput!): DropFolder!
  "Stops importing from the folder and forgets its history; its files are not touched. Administrators only."
  deleteDropFolder(id: ID!): Boolean!
  "Imports a file even though it is incomplete or a duplicate (then as another copy of its track), first writing the given tags into it. Requires MANAGE_LIBRARIES."
  acceptImportItem(id: ID!, tags: ImportTagsInput): ImportItem!
  "Looks at a file again, as if it had just been dropped. Requires MANAGE_LIBRARIES."
