type Subscription {
  "A song the user sees has its analysis (new, or redone by a newer analyzer)."
  trackAnalysisReady: TrackAnalysisReady!
  "The AI extension's status as it changes, at most once a second. Administrators only."
  aiStatusChanged: AiStatus!
  "Progress of the background audio analysis, at most once a second. Requires MANAGE_LIBRARIES."
  analysisProgressChanged: AnalysisProgress!
  "Runs of backups as they change: their state at once, their progress about once a second. Administrators only."
  backupJobUpdated: BackupJob!
  "Restores as they change: their state at once, their progress about once a second. Administrators only."
  restoreJobUpdated: RestoreJobInfo!
  "The user's StarTracks (or other ratings) changed, here or through their Ultimate Cloud account."
  starTracksChanged: StarTracksChange!
  "Changes of scans of one library, or of all the user can see: status changes immediately, progress at most twice a second. Requires RUN_SCANS or MANAGE_LIBRARIES."
  scanJobUpdated(libraryId: ID): ScanJob!
  "The catalog changed in libraries the user can access: tracks edited or deleted (with their ids), or a scan that added, updated or lost files (`scanned`). Refresh with tracks(changedSince:) and trackIds."
  catalogChanged: CatalogChange!
  "A song of the user's wish list arrived in a library they can play (after a scan, an upload, an import or a sync)."
  wishObtained: WishObtained!
}

type TrackAnalysisReady {
  trackId: ID!
  analysisVersion: Int!
}

type StarTracksChange {
  changedAt: DateTime!
}

type CatalogChange {
  libraryIds: [ID!]!
  updatedTrackIds: [ID!]!
  removedTrackIds: [ID!]!
  scanned: Boolean!
  changedAt: DateTime!
}

