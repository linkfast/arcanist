  streamingDefaults: StreamingDefaults!
  "The latest migration codes of this server, active or not. Administrators only."
  migrationCodes: [MigrationCodeInfo!]!
  "Other Arcanist servers: those on the local networks (a few seconds' search) and those paired through the P2P network. Administrators only."
