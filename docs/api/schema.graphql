type Query {
  "A song's analysis for DJ software (AI extension): beat grid, sections, energy, voice, mix and scratch points… `include` picks blocks (beats, onsets, energy, vocals, sections, silences, cues, loudness, key, stats; all but stats by default). PENDING with its position in line until it is ready."
  trackAnalysis(trackId: ID!, include: String): TrackAnalysisResult!
  "Analyses of the songs the user sees, from the least to the most recently analyzed (at most 200 a page): keep a cache with updatedSince set to the last analyzedAt held."
  trackAnalyses(updatedSince: DateTime, after: String, first: Int, include: String): TrackAnalysisPage!
  "Listening statistics per song (plays, skips and where, completions, how much is listened to, hours of the day): the user's, or the server's (everyone's together). From the least to the most recently played."
  trackStats(scope: TrackStatsScope, updatedSince: DateTime, after: String, first: Int, timeZone: String): TrackStatsPage!
  "What the AI extension's analysis is doing, its progress and settings. Administrators only."
