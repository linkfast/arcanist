  setUserLibraries(id: ID!, input: SetUserLibrariesInput!): UserAccount!
  "Sets a new password and signs the user out everywhere. Requires MANAGE_USERS and a recent authentication."
  resetUserPassword(id: ID!, input: ResetUserPasswordInput!): Boolean!
  "Requires MANAGE_USERS and a recent authentication."
  deleteUser(id: ID!): Boolean!
  "Changes the signed-in user's password and signs out their other devices."
  changeMyPassword(input: ChangeMyPasswordInput!): Boolean!
  "Signs out one of the signed-in user's devices."
  revokeMySession(id: ID!): Boolean!
}

