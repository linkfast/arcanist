  restoreJob(id: ID!): RestoreJobInfo!
  "A run of a backup and how far it got. Administrators only."
  backupRun(id: ID!): BackupJob!
  "Performers and album artists with music the user can play, by name; optionally only those with music in a library. Pages of `first` items (default 50, at most 500) after the `after` cursor."
  artists(search: String, after: String, first: Int, libraryId: ID): ArtistPage!
  artist(id: ID!): Artist!
