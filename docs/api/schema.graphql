type Query {
  "Performers and album artists with music the user can play, by name. Pages of `first` items (default 50, at most 500) after the `after` cursor."
  artists(search: String, after: String, first: Int): ArtistPage!
  artist(id: ID!): Artist!
  "Albums with music the user can play, by title; optionally only those of an artist."
  albums(search: String, artistId: ID, after: String, first: Int): AlbumPage!
  album(id: ID!): Album!
  "Tracks the user can play, by title. With albumId, all of the album's tracks in disc and track order, without paging."
  tracks(search: String, albumId: ID, artistId: ID, after: String, first: Int): TrackPage!
  track(id: ID!): Track!
  "Libraries the signed-in user can access."
  libraries: [Library!]!
  "A library by id. Libraries the user cannot access are reported as not found."
  library(id: ID!): Library!
  "Folders on the server, for choosing library locations. Lists the file system roots when path is omitted. Administrators only."
  serverDirectories(path: String): ServerDirectoryListing!
  "Most recent scans first, of one library or of all libraries the user can see. Requires RUN_SCANS or MANAGE_LIBRARIES."
  scanJobs(libraryId: ID, limit: Int): [ScanJob!]!
  "A scan by id, including live progress while it runs. Requires RUN_SCANS or MANAGE_LIBRARIES."
  scanJob(id: ID!): ScanJob!
  "Public description of the server. Does not require authentication."
  serverInfo: ServerInfo!
  "The signed-in user."
  me: UserAccount!
  "Devices where the signed-in user is currently signed in."
  mySessions: [Session!]!
  "All users. Requires the MANAGE_USERS permission."
  users: [UserAccount!]!
  "A user by id. Requires the MANAGE_USERS permission."
  user(id: ID!): UserAccount!
}

type ArtistPage {
  items: [Artist!]!
  nextCursor: String
  totalCount: Int!
}

type Artist {
  id: ID!
  name: String!
  sortName: String
  musicBrainzId: ID
}

type AlbumPage {
  items: [Album!]!
  nextCursor: String
  totalCount: Int!
}

type Album {
  id: ID!
  title: String!
  artist: ArtistReference!
  year: Int
  isCompilation: Boolean!
  musicBrainzId: ID
  artworkId: ID
  trackCount: Int!
  durationMs: Long!
}

type ArtistReference {
  id: ID!
  name: String!
}

scalar Long

type TrackPage {
  items: [Track!]!
  nextCursor: String
  totalCount: Int!
}

type Track {
  id: ID!
  title: String!
  album: AlbumReference!
  artists: [ArtistCredit!]!
  discNumber: Int
  trackNumber: Int
  durationMs: Int!
  artworkId: ID
  genres: [String!]!
  addedAt: DateTime!
  files: [TrackFile!]!
}

type AlbumReference {
  id: ID!
  title: String!
}

type ArtistCredit {
  artistId: ID!
  name: String!
  role: ArtistRole!
}

enum ArtistRole {
  PRIMARY
  FEATURED
  COMPOSER
  CONDUCTOR
  REMIXER
  LYRICIST
  PRODUCER
}

"The `DateTime` scalar type represents a date and time. `DateTime` expects timestamps to be formatted in accordance with the [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) standard."
scalar DateTime

type TrackFile {
  id: ID!
  format: String
  bitRate: Int
  sampleRate: Int
  bitDepth: Int
  channels: Int
  size: Long!
  durationMs: Int!
  replayGainTrackGain: Float
  replayGainAlbumGain: Float
}

type Library {
  id: ID!
  name: String!
  visibleToAll: Boolean!
  scanIntervalHours: Int
  createdAt: DateTime!
  lastScanAt: DateTime
  sources: [LibrarySource!]
}

type LibrarySource {
  id: ID!
  kind: LibrarySourceKind!
  location: String!
}

enum LibrarySourceKind {
  LOCAL
}

type ServerDirectoryListing {
  path: String
  parent: String
  directories: [ServerDirectory!]!
}

type ServerDirectory {
  name: String!
  path: String!
  isHidden: Boolean!
}

type ScanJob {
  id: ID!
  libraryId: ID!
  kind: ScanKind!
  status: ScanStatus!
  requestedAt: DateTime!
  startedAt: DateTime
  finishedAt: DateTime
  filesSeen: Int!
  filesAdded: Int!
  filesUpdated: Int!
  filesMissing: Int!
  errors: Int!
  errorCode: String
  progress: ScanProgress
}

enum ScanKind {
  INCREMENTAL
  FULL
}

enum ScanStatus {
  QUEUED
  RUNNING
  COMPLETED
  CANCELLED
  FAILED
}

type ScanProgress {
  phase: ScanPhase!
  filesFound: Int!
  filesToRead: Int!
  filesRead: Int!
}

enum ScanPhase {
  DISCOVERING
  READING
  CLEANING_UP
}

type ServerInfo {
  name: String!
  version: String!
  apiVersion: Int!
  sourceUrl: String
  setupCompleted: Boolean!
  capabilities: [Capability!]!
  cloudTier: CloudTier!
}

enum Capability {
  ULTIMATE_CLOUD_SOURCE
  CLOUD_SYNC
  THIRD_PARTY_STORAGE
  CLOUD_CONNECT
}

enum CloudTier {
  NONE
  FREE
  PAID
}

type UserAccount {
  id: ID!
  userName: String!
  displayName: String
  role: UserRole!
  permissions: [Permission!]!
  isDisabled: Boolean!
  createdAt: DateTime!
  lastLoginAt: DateTime
  libraryIds: [ID!]!
}

enum UserRole {
  USER
  ADMIN
}

enum Permission {
  MANAGE_LIBRARIES
  MANAGE_USERS
  MANAGE_SETTINGS
  RUN_SCANS
  DOWNLOAD
  VIEW_ALL_STATS
}

type Session {
  id: ID!
  deviceName: String
  userAgent: String
  ipAddress: String
  createdAt: DateTime!
  lastSeenAt: DateTime!
  expiresAt: DateTime!
  isCurrent: Boolean!
}

type Mutation {
  "Requires MANAGE_LIBRARIES."
  createLibrary(input: CreateLibraryInput!): Library!
  "Requires MANAGE_LIBRARIES."
  updateLibrary(id: ID!, input: UpdateLibraryInput!): Library!
  "Removes the library and its tracks from the catalog; files on disk are not touched. Requires MANAGE_LIBRARIES and a recent authentication."
  deleteLibrary(id: ID!): Boolean!
  "Adds a location to a library. Requires MANAGE_LIBRARIES."
  addLibrarySource(libraryId: ID!, input: LibrarySourceInput!): Library!
  "Removes a location and its tracks from the catalog; files on disk are not touched. Requires MANAGE_LIBRARIES."
  removeLibrarySource(id: ID!): Library!
  "Queues a scan, or returns the one already queued or running for the library. A full scan re-reads every file. Requires RUN_SCANS."
  startScan(libraryId: ID!, full: Boolean!): ScanJob!
  "Requires RUN_SCANS."
  cancelScan(id: ID!): Boolean!
  "Requires MANAGE_USERS and a recent authentication."
  createUser(input: CreateUserInput!): UserAccount!
  "Requires MANAGE_USERS and a recent authentication."
  updateUser(id: ID!, input: UpdateUserInput!): UserAccount!
  "Replaces the libraries explicitly granted to a user. Requires MANAGE_USERS and a recent authentication."
  setUserLibraries(id: ID!, input: SetUserLibrariesInput!): UserAccount!
  "Sets a new password and signs the user out everywhere. Requires MANAGE_USERS and a recent authentication."
  resetUserPassword(id: ID!, input: ResetUserPasswordInput!): Boolean!
  "Requires MANAGE_USERS and a recent authentication."
  deleteUser(id: ID!): Boolean!
  "Changes the signed-in user's password and signs out their other devices."
  changeMyPassword(input: ChangeMyPasswordInput!): Boolean!
  "Signs out one of the signed-in user's devices."
  revokeMySession(id: ID!): Boolean!
}

input CreateLibraryInput {
  name: String!
  visibleToAll: Boolean!
  scanIntervalHours: Int
  sources: [LibrarySourceInput!]!
}

input LibrarySourceInput {
  location: String!
}

input UpdateLibraryInput {
  name: String!
  visibleToAll: Boolean!
  scanIntervalHours: Int
}

input CreateUserInput {
  userName: String!
  password: String!
  displayName: String
  role: UserRole!
  permissions: [Permission!]
  libraryIds: [ID!]
}

input UpdateUserInput {
  displayName: String
  role: UserRole!
  permissions: [Permission!]
  isDisabled: Boolean!
}

input SetUserLibrariesInput {
  libraryIds: [ID!]!
}

input ResetUserPasswordInput {
  newPassword: String!
}

input ChangeMyPasswordInput {
  currentPassword: String!
  newPassword: String!
}

type Subscription {
  "Changes of scans of one library, or of all the user can see: status changes immediately, progress at most twice a second. Requires RUN_SCANS or MANAGE_LIBRARIES."
  scanJobUpdated(libraryId: ID): ScanJob!
}
