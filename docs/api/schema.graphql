  refreshMyUltimateCloud: MyUltimateCloudStatus!
  "Chooses what the caller's own account gets from this server: their plays, albums heard whole, StarTracks, statistics."
  setMyUltimateCloudServices(input: UltimateCloudServicesInput!): MyUltimateCloudStatus!
  "Turns Ultimate Cloud's sync component (ultimate-audio, closed source) on or off: on, it is installed and syncing libraries, Cloud Drop and uploads to Ultimate Cloud work, and the server's edition is ULTIMATE; off, it is removed. Administrators only, with a recent authentication."
  setUltimateCloudSync(enabled: Boolean!): UltimateCloudStatus!
  "Reads the account's plan again now. Administrators only."
  refreshUltimateCloud: UltimateCloudStatus!
  "Sets the library uploads go to when they name none; null leaves the choice to each upload. Requires MANAGE_LIBRARIES."
  setUploadSettings(input: SetUploadSettingsInput!): UploadSettings!
  "Forgets the user's finished uploads (what is still on its way stays). Returns how many were forgotten."
  clearMyUploads: Int!
  "Sends songs of this server (at most 1000) to the user's own Ultimate Cloud library, in the background; their progress is in myUploads. Needs the DOWNLOAD permission, and for a library another server shares, its permission to download."
  uploadTracksToMyCloud(input: UploadTracksToMyCloudInput!): [MyUpload!]!
  "Requires MANAGE_USERS and a recent authentication."
  createUser(input: CreateUserInput!): UserAccount!
  "Requires MANAGE_USERS and a recent authentication."
  updateUser(id: ID!, input: UpdateUserInput!): UserAccount!
  "Replaces the libraries explicitly granted to a user. Requires MANAGE_USERS and a recent authentication."
  setUserLibraries(id: ID!, input: SetUserLibrariesInput!): UserAccount!
  "Sets a new password and signs the user out everywhere. Requires MANAGE_USERS and a recent authentication."
  resetUserPassword(id: ID!, input: ResetUserPasswordInput!): Boolean!
  "Requires MANAGE_USERS and a recent authentication."
  deleteUser(id: ID!): Boolean!
  "Changes the signed-in user's password and signs out their other devices."
  changeMyPassword(input: ChangeMyPasswordInput!): Boolean!
  "Signs out one of the signed-in user's devices."
  revokeMySession(id: ID!): Boolean!
  "Links a music video to a track's song (or, without trackId, leaves it with no song); scans keep what a person chose. It is aligned again first of all. Requires MANAGE_LIBRARIES or EDIT_METADATA."
  linkMusicVideo(id: ID!, trackId: ID): VideoClip!
  "Gives a music video back to automatic linking (by its name next to its song, or its artist and title) and to the live detection of its title. Requires MANAGE_LIBRARIES or EDIT_METADATA."
  unlockMusicVideo(id: ID!): VideoClip!
  "Marks a music video as a live performance or not (scans keep it): a live video is only linked to a live track. Requires MANAGE_LIBRARIES or EDIT_METADATA."
  setMusicVideoLive(id: ID!, live: Boolean!): VideoClip!
  "Forgets a music video's alignment and aligns it again first of all. Requires MANAGE_LIBRARIES or EDIT_METADATA."
  realignMusicVideo(id: ID!): VideoClip!
  "Moves a music video's file to the trash of its location (purged after 30 days) and removes it from the catalog; its song stays. Requires DELETE_TRACKS and a library the user adds to."
  deleteMusicVideo(id: ID!): Boolean!
  "Sets how the server handles music videos (heights from 2160, 1440, 1080, 720, 480 and 360). Requires MANAGE_SETTINGS."
  setVideoSettings(input: VideoSettingsInput!): VideoSettingsInfo!
  "Chooses whose audio plays with music videos for the user: TRACK (the song from the library where the video plays it), VIDEO (the video's own), or null for the server's default. Players can still switch while playing."
  setMyVideoSettings(audio: VideoAudioMode): MyVideoSettings!
  "Adds a song to the user's wish list (title and artist; album, duration, MusicBrainz recording or AcoustID narrow it). When a library the user can play has it already, it comes obtained (foundWhenAdded)."
  addWish(input: WishInput!): Wish!
  "Reads a song's link from a streaming service (Spotify, YouTube Music, Deezer, Apple Music, MusicBrainz, Tidal, SoundCloud, Bandcamp…) to fill a wish: title, artist, album, duration, the MusicBrainz recording and a cover (kept in the artwork cache). Adds nothing: pass what it returns to addWish with sourceUrl and artworkId. Needs external services allowed (external_services_disabled); wish_link_not_a_song for albums or playlists, wish_link_unreadable when the page does not say the song."
  resolveWishLink(input: ResolveWishLinkInput!): WishLinkPreview!
  "Changes a wish of the user. Another song makes it wanted again, and it is looked for at once."
  updateWish(id: ID!, input: WishInput!): Wish!
  "Removes a wish (wanted or obtained) from the user's list."
  removeWish(id: ID!): Boolean!
  "The user saw the wishes that came true (WishListResult.unseen goes to 0). Returns how many were new."
