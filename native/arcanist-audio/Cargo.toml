[package]
name = "arcanist-audio"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Audio analysis for Arcanist: decoding, loudness, fingerprints, waveform, tempo and key."
repository = "https://github.com/linkfast/arcanist"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "adpcm", "aiff", "alac", "ape", "caf", "flac", "isomp4", "mkv", "mpa", "ogg", "pcm", "vorbis", "wav", "opt-simd"] }
ebur128 = "0.1.10"
rusty-chromaprint = "0.3.0"
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Panics must unwind: the FFI boundary catches them, so a malformed file cannot take the server down.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
