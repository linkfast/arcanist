[package]
name = "arcanist-p2p"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Peer-to-peer tunnels for Arcanist over iroh: serve the server's HTTP port to paired nodes, and reach other nodes through a local port."
repository = "https://github.com/linkfast/arcanist"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Swift and Kotlin bindings for the mobile apps.
mobile = ["dep:uniffi"]
# The uniffi-bindgen command that writes those bindings.
bindgen = ["mobile", "uniffi/cli"]

[dependencies]
iroh = "=1.3.0"
iroh-tickets = "=1.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = { version = "=0.32.2", optional = true }

[[bin]]
name = "uniffi-bindgen"
path = "bindgen/uniffi-bindgen.rs"
required-features = ["bindgen"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
