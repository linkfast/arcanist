[package]
name = "arcanist-player"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Server audio for Arcanist: plays music on an audio device of the server (decoding, resampling, gapless queue)."
repository = "https://github.com/linkfast/arcanist"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "adpcm", "aiff", "alac", "ape", "caf", "flac", "isomp4", "mkv", "mpa", "ogg", "pcm", "vorbis", "wav", "opt-simd"] }
cpal = "0.16"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Panics must unwind: the FFI boundary catches them, so a malformed file cannot take the server down.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
