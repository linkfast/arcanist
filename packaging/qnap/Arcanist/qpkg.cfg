# QNAP package of Arcanist (QDK). qpkg.sh fills @VERSION@ and builds one package per architecture.
QPKG_NAME="Arcanist"
QPKG_DISPLAY_NAME="Arcanist"
# At most 10 characters: qpkg.sh shortens pre-releases (0.1.0-alpha.6 is 0.1.0a6).
QPKG_VER="@VERSION@"
QPKG_AUTHOR="LinkFast S.A."
QPKG_LICENSE="AGPL-3.0-or-later"
QPKG_SUMMARY="Self-hosted music server: your music, streamed to all your devices."
QPKG_RC_NUM="190"
QPKG_SERVICE_PROGRAM="Arcanist.sh"
QPKG_SERVICE_PIDFILE="/var/run/arcanist.pid"
# Its page on QTS's own web server (admins only): status, setup code, log and the button that opens Arcanist.
QPKG_WEBUI="/cgi-bin/qpkg/Arcanist/index.cgi"
QPKG_USE_PROXY="1"
QPKG_DESKTOP_APP="0"
QPKG_VISIBLE="1"
QTS_MINI_VERSION="5.0.0"
QPKG_VOLUME_SELECT="1"
# Seconds to start and to stop (the server stops cleanly in a few).
QPKG_TIMEOUT="60,90"
QDK_DATA_DIR_ICONS="icons"
QDK_DATA_DIR_SHARED="shared"
