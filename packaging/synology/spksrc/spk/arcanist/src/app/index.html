<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arcanist</title>
    <!-- Arcanist's window in DSM: the package's state and settings, for DSM administrators (api.cgi checks). -->
    <style>
      :root {
        color-scheme: light;
        --text: #1f2933;
        --muted: #616e7c;
        --line: #d9e2ec;
        --panel: #ffffff;
        --back: #f5f7fa;
        --accent: #0b6bcb;
        --good: #1b7f3b;
        --bad: #b42318;
        --warn: #b54708;
        --warn-back: #fff7e6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px;
        font: 13px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        background: var(--back);
      }
      h1 { margin: 0 0 2px; font-size: 18px; }
      h2 { margin: 0 0 8px; font-size: 14px; }
      p { margin: 0 0 8px; }
      .muted { color: var(--muted); }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; margin-top: 12px; }
      .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      .grow { flex: 1; }
      .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
      .badge.good { color: var(--good); border-color: var(--good); }
      .badge.bad { color: var(--bad); border-color: var(--bad); }
      .badge.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-back); }
      button, .button {
        font: inherit; padding: 5px 12px; border-radius: 4px; border: 1px solid var(--line); background: #fff;
        color: var(--text); cursor: pointer; text-decoration: none; display: inline-block;
      }
      button.primary, .button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:disabled { opacity: .6; cursor: default; }
      input { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; width: 7em; }
      code { font: 12px ui-monospace, Consolas, monospace; }
      .code { font: 600 20px ui-monospace, Consolas, monospace; letter-spacing: .08em; }
      table { width: 100%; border-collapse: collapse; }
      td { padding: 5px 4px; border-top: 1px solid var(--line); vertical-align: top; }
      .note { background: var(--warn-back); border-radius: 4px; padding: 8px 10px; margin-top: 8px; }
      .error { color: var(--bad); }
      ol { margin: 4px 0 0; padding-left: 20px; }
      .variables td { border: 0; padding: 3px 4px 3px 0; }
      .variables input { width: 100%; }
      .variables input.invalid { border-color: var(--bad); }
      .variables td:last-child { width: 1%; }
      .tabs { display: flex; gap: 4px; margin-top: 12px; border-bottom: 1px solid var(--line); }
      .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 12px; }
      .tabs button[aria-selected="true"] { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
      .logs select, .logs input[type="search"] { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
      .logs input[type="search"] { width: 9em; }
      .logs #logFile { max-width: 220px; }
      .logview {
        height: calc(100vh - 250px); min-height: 200px; overflow: auto; margin-top: 10px; padding: 8px 10px;
        border-radius: 4px; background: #111820; color: #d9e2ec;
        font: 12px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-all;
      }
      .logview .l-debug { color: #8796a8; }
      .logview .l-warn { color: #f5b14c; }
      .logview .l-error { color: #ff7b72; }
      .logview .empty { color: #8796a8; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="grow">
        <h1>Arcanist</h1>
        <p class="muted" data-t="subtitle"></p>
      </div>
      <a class="button primary" id="open" target="_blank" rel="noopener" data-t="open" hidden></a>
    </div>

    <p class="error" id="failure" hidden></p>

    <!-- Shown once the state arrives. -->
    <main id="content" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabGeneral" aria-selected="true" data-t="tabGeneral"></button>
      <button role="tab" id="tabLogs" aria-selected="false" data-t="tabLogs"></button>
    </div>

    <section id="general">
    <div class="card">
      <h2 data-t="state"></h2>
      <div class="row">
        <span class="badge" id="running"></span>
        <span class="muted" id="version"></span>
        <span class="badge warn" id="testBadge" data-t="testBadge" hidden></span>
        <span class="grow"></span>
        <button id="restart" data-t="restart"></button>
      </div>
      <div class="row" style="margin-top: 8px">
        <span class="muted" data-t="components"></span>
        <span class="badge" id="dotnet"></span>
        <span class="badge" id="ffmpeg"></span>
      </div>
      <div id="setup" hidden>
        <p style="margin-top: 10px" data-t="setupHelp"></p>
        <div class="code" id="code"></div>
      </div>
    </div>

    <div class="card">
      <h2 data-t="port"></h2>
      <p class="muted" data-t="portHelp"></p>
      <div class="row">
        <input id="port" type="number" min="1024" max="65535" />
        <button class="primary" id="savePort" data-t="change"></button>
        <span class="muted" id="portState"></span>
      </div>
      <p class="note" data-t="firewall"></p>
    </div>

    <div class="card">
      <h2 data-t="folders"></h2>
      <p class="muted" data-t="foldersHelp"></p>
      <table><tbody id="shares"></tbody></table>
      <div id="howto" class="note" hidden>
        <strong data-t="howtoTitle"></strong>
        <ol>
          <li data-t="howto1"></li>
          <li data-t="howto2"></li>
          <li data-t="howto3"></li>
          <li data-t="howto4"></li>
        </ol>
        <p style="margin: 8px 0 0"><button id="openShares" data-t="openShares"></button></p>
      </div>
    </div>

    <div class="card">
      <h2 data-t="data"></h2>
      <p class="muted"><span data-t="dataHelp"></span> <code id="dataDir"></code> (<span id="dataSize"></span>)</p>
    </div>

    <div class="card">
      <h2 data-t="testMode"></h2>
      <p class="muted" data-t="testHelp"></p>
      <label class="row">
        <input type="checkbox" id="testEnabled" style="width: auto" />
        <span data-t="testEnable"></span>
      </label>
      <div id="testEditor" hidden>
        <table class="variables"><tbody id="variables"></tbody></table>
        <p style="margin: 6px 0 0"><button id="addVariable" data-t="addVariable"></button></p>
        <p class="note" data-t="testNote"></p>
      </div>
      <div class="row" style="margin-top: 10px">
        <button class="primary" id="saveTest" data-t="saveTest"></button>
        <span class="muted" id="testState"></span>
      </div>
      <!-- Settings worth trying against services not published yet. -->
      <datalist id="knownKeys">
        <option value="Arcanist:UltimateCloud:ApiUrl"></option>
        <option value="Arcanist:UltimateCloud:EventsUrl"></option>
        <option value="Arcanist:UltimateCloud:ToolsUrl"></option>
        <option value="Arcanist:UltimateCloud:Authority"></option>
        <option value="Arcanist:UltimateCloud:ClientId"></option>
        <option value="Serilog:MinimumLevel:Default"></option>
      </datalist>
    </div>
    </section>

    <section id="logs" class="logs" hidden>
      <div class="card">
        <div class="row">
          <select id="logFile"></select>
          <select id="logLevel">
            <option value="0" data-t="levelAll"></option>
            <option value="3" data-t="levelWarn"></option>
            <option value="4" data-t="levelError"></option>
          </select>
          <input id="logSearch" type="search" data-tp="search" />
          <span class="grow"></span>
          <label class="row" style="gap: 4px"><input type="checkbox" id="logFollow" style="width: auto" checked /> <span data-t="follow"></span></label>
          <button id="logDownload" data-t="download"></button>
        </div>
        <div class="logview" id="logView"></div>
        <p class="muted" id="logInfo" style="margin: 6px 0 0"></p>
      </div>
    </section>
    </main>

    <script>
      "use strict";
      const texts = {
        es: {
          subtitle: "Tu servidor de música en este NAS.",
          open: "Abrir Arcanist",
          state: "Estado",
          on: "En marcha",
          off: "Detenido",
          version: "Versión {v}",
          restart: "Reiniciar",
          components: "Paquetes de los que depende:",
          dotnetName: ".NET 10",
          ffmpegName: "FFmpeg 8",
          setupHelp: "Arcanist aún no está configurado. Ábrelo y sigue su asistente; te pedirá este código:",
          port: "Puerto",
          portHelp: "El puerto en el que responde Arcanist. Al cambiarlo, Arcanist se reinicia en el nuevo.",
          change: "Cambiar",
          portSaved: "Arcanist se está reiniciando en el puerto {p}.",
          firewall: "Si usas el firewall de DSM, permite el puerto nuevo (Panel de control > Seguridad > Firewall). Para usar HTTPS y un nombre propio, crea una regla de proxy inverso hacia este puerto (Panel de control > Portal de inicio de sesión > Avanzado > Proxy inverso).",
          folders: "Carpetas compartidas",
          foldersHelp: "Arcanist funciona con el usuario interno {u}. Solo puede usar como biblioteca las carpetas que ese usuario puede leer.",
          readable: "Arcanist puede leerla",
          notReadable: "Arcanist no puede leerla",
          unknown: "No se pudo comprobar",
          howtoTitle: "Para que Arcanist pueda leer una carpeta:",
          howto1: "Abre Panel de control > Carpeta compartida, elige la carpeta y pulsa Editar.",
          howto2: "En Permisos, cambia la lista a «Usuario interno del sistema».",
          howto3: "Marca «Solo lectura» para {u} (o «Lectura/escritura» si quieres que Arcanist organice archivos, importe o reciba subidas) y pulsa Guardar.",
          howto4: "Después, añádela en Arcanist como biblioteca: su ruta aparece en la tabla.",
          openShares: "Abrir Carpeta compartida",
          data: "Datos de Arcanist",
          dataHelp: "Base de datos, claves, cachés y registros, en el volumen del sistema del paquete:",
          not_signed_in: "Abre Arcanist desde el menú principal de DSM, con una sesión de administrador.",
          not_admin: "Solo los administradores de DSM pueden ver esta ventana.",
          port_in_use: "Ese puerto ya lo usa otro programa.",
          invalid_port: "Escribe un puerto de 1024 a 65535.",
          not_running: "Arcanist no está en marcha: inícialo desde el Centro de paquetes.",
          cannot_restart: "No se pudo reiniciar Arcanist desde aquí: detén e inicia el paquete en el Centro de paquetes.",
          cannot_write: "No se pudo guardar el cambio.",
          testMode: "Modo de prueba",
          testBadge: "Modo de prueba",
          testHelp: "Para probar Arcanist con servicios que aún no están publicados, como un Ultimate Cloud de pruebas. Cada variable se le pasa a Arcanist al arrancar: un ajuste de Arcanist (Arcanist:UltimateCloud:ApiUrl) o una variable de entorno.",
          testEnable: "Activar modo de prueba",
          keyPlaceholder: "Arcanist:UltimateCloud:ApiUrl",
          valuePlaceholder: "Valor",
          addVariable: "Añadir variable",
          remove: "Quitar",
          testNote: "Tienen prioridad sobre el archivo de configuración de Arcanist (arcanist.json). Al desactivar el modo de prueba se conservan, pero dejan de aplicarse.",
          saveTest: "Guardar y reiniciar",
          testSavedRestart: "Guardado. Arcanist se está reiniciando.",
          testSaved: "Guardado. Se aplicará cuando Arcanist arranque.",
          invalid_variable: "Nombre no válido: usa letras, números, «_» y «:», sin empezar por un número.",
          reserved_variable: "{k} no se puede cambiar: lo usa el paquete.",
          too_large: "Hay demasiadas variables.",
          failed: "No se pudo leer el estado de Arcanist.",
          tabGeneral: "General",
          tabLogs: "Registros",
          logLatest: "Arcanist (el más reciente)",
          logOf: "Arcanist del {d}",
          logPackage: "Salida del paquete (supervisor y consola)",
          levelAll: "Todos los niveles",
          levelWarn: "Avisos y errores",
          levelError: "Solo errores",
          search: "Buscar",
          follow: "En vivo",
          download: "Descargar",
          logEmpty: "Aún no hay nada en este registro.",
          logShown: "{f} · {s} · {n} líneas",
          log_not_found: "Ese registro no existe todavía o ya se borró.",
          cannot_read: "Esta ventana no puede leer los registros de Arcanist.",
        },
        en: {
          subtitle: "Your music server on this NAS.",
          open: "Open Arcanist",
          state: "State",
          on: "Running",
          off: "Stopped",
          version: "Version {v}",
          restart: "Restart",
          components: "Packages it depends on:",
          dotnetName: ".NET 10",
          ffmpegName: "FFmpeg 8",
          setupHelp: "Arcanist is not set up yet. Open it and follow its wizard; it asks for this code:",
          port: "Port",
          portHelp: "The port Arcanist answers on. Changing it restarts Arcanist on the new one.",
          change: "Change",
          portSaved: "Arcanist is restarting on port {p}.",
          firewall: "If you use DSM's firewall, allow the new port (Control Panel > Security > Firewall). For HTTPS and a name of your own, create a reverse proxy rule to this port (Control Panel > Login Portal > Advanced > Reverse Proxy).",
          folders: "Shared folders",
          foldersHelp: "Arcanist runs as the internal user {u}. It can only use as libraries the folders that user can read.",
          readable: "Arcanist can read it",
          notReadable: "Arcanist cannot read it",
          unknown: "Could not be checked",
          howtoTitle: "To let Arcanist read a folder:",
          howto1: "Open Control Panel > Shared Folder, choose the folder and click Edit.",
          howto2: "In Permissions, switch the list to “System internal user”.",
          howto3: "Tick “Read only” for {u} (or “Read/Write” to let Arcanist organize files, import or receive uploads) and click Save.",
          howto4: "Then add it in Arcanist as a library: its path is in the table.",
          openShares: "Open Shared Folder",
          data: "Arcanist's data",
          dataHelp: "Database, keys, caches and logs, on the package's system volume:",
          not_signed_in: "Open Arcanist from DSM's main menu, signed in as an administrator.",
          not_admin: "Only DSM administrators can see this window.",
          port_in_use: "Another program already uses that port.",
          invalid_port: "Enter a port from 1024 to 65535.",
          not_running: "Arcanist is not running: start it from Package Center.",
          cannot_restart: "Arcanist could not be restarted from here: stop and start the package in Package Center.",
          cannot_write: "The change could not be saved.",
          testMode: "Test mode",
          testBadge: "Test mode",
          testHelp: "To try Arcanist with services not published yet, such as a test Ultimate Cloud. Each variable is given to Arcanist when it starts: an Arcanist setting (Arcanist:UltimateCloud:ApiUrl) or an environment variable.",
          testEnable: "Turn on test mode",
          keyPlaceholder: "Arcanist:UltimateCloud:ApiUrl",
          valuePlaceholder: "Value",
          addVariable: "Add variable",
          remove: "Remove",
          testNote: "They take precedence over Arcanist's settings file (arcanist.json). Turning test mode off keeps them, but they stop applying.",
          saveTest: "Save and restart",
          testSavedRestart: "Saved. Arcanist is restarting.",
          testSaved: "Saved. It applies when Arcanist starts.",
          invalid_variable: "Invalid name: use letters, digits, “_” and “:”, not starting with a digit.",
          reserved_variable: "{k} cannot be changed: the package relies on it.",
          too_large: "There are too many variables.",
          failed: "Arcanist's state could not be read.",
          tabGeneral: "General",
          tabLogs: "Logs",
          logLatest: "Arcanist (the newest)",
          logOf: "Arcanist on {d}",
          logPackage: "The package's output (supervisor and console)",
          levelAll: "All levels",
          levelWarn: "Warnings and errors",
          levelError: "Errors only",
          search: "Search",
          follow: "Live",
          download: "Download",
          logEmpty: "Nothing in this log yet.",
          logShown: "{f} · {s} · {n} lines",
          log_not_found: "That log does not exist yet, or was deleted.",
          cannot_read: "This window cannot read Arcanist's logs.",
        },
      };
      const lang = (navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en";
      const t = (key, values = {}) =>
        (texts[lang][key] || key).replace(/\{(\w+)\}/g, (_, name) => values[name] ?? "");
      const $ = (id) => document.getElementById(id);
      let state = null;
      // While the test mode's form has unsaved changes, refreshing the state leaves it alone.
      let editingTest = false;

      // The DSM session's SynoToken: from the window that shows this page, or from DSM itself.
      const token = new URLSearchParams(location.search).get("SynoToken") || (() => {
        try {
          return window.parent.SYNO.SDS.Session.SynoToken || "";
        } catch {
          return "";
        }
      })();

      function translate(user) {
        for (const element of document.querySelectorAll("[data-t]"))
          element.textContent = t(element.dataset.t, { u: user || "sc-arcanist" });
        for (const element of document.querySelectorAll("[data-tp]")) element.placeholder = t(element.dataset.tp);
      }

      function fail(code) {
        $("failure").textContent = t(code || "failed");
        $("failure").hidden = false;
      }

      function size(bytes) {
        const units = ["B", "KB", "MB", "GB", "TB"];
        let value = bytes, unit = 0;
        while (value >= 1000 && unit < units.length - 1) { value /= 1000; unit++; }
        return new Intl.NumberFormat(lang, { maximumFractionDigits: 1 }).format(value) + " " + units[unit];
      }

      async function load() {
        let response;
        try {
          response = await fetch("api.cgi?action=status", {
            cache: "no-store",
            credentials: "same-origin",
            headers: { "X-SYNO-TOKEN": token },
          });
        } catch {
          return fail("failed");
        }
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          $("content").hidden = true;
          $("open").hidden = true;
          return fail(body.error);
        }
        $("failure").hidden = true;
        $("content").hidden = false;
        $("open").hidden = false;
        state = body;
        render();
      }

      function render() {
        translate(state.serviceUser);
        const url = `http://${location.hostname}:${state.port}/`;
        $("open").href = state.setupCompleted ? url + "admin/" : url;
        $("running").textContent = t(state.running ? "on" : "off");
        $("running").className = "badge " + (state.running ? "good" : "bad");
        $("version").textContent = state.version ? t("version", { v: state.version }) : "";
        $("restart").disabled = !state.running;
        for (const [id, present] of [["dotnet", state.dotnet], ["ffmpeg", state.ffmpeg]]) {
          $(id).textContent = t(id + "Name");
          $(id).className = "badge " + (present ? "good" : "bad");
        }
        $("setup").hidden = state.setupCompleted || !state.setupCode;
        $("code").textContent = state.setupCode || "";
        if (document.activeElement !== $("port")) $("port").value = state.port;
        $("dataDir").textContent = state.dataDirectory;
        $("dataSize").textContent = size(state.dataBytes);

        const rows = state.shares.map((share) => {
          const row = document.createElement("tr");
          const name = document.createElement("td");
          name.innerHTML = "<strong></strong><br><code></code>";
          name.querySelector("strong").textContent = share.name;
          name.querySelector("code").textContent = share.path;
          const access = document.createElement("td");
          const badge = document.createElement("span");
          badge.className = "badge " + (share.readable === true ? "good" : share.readable === false ? "bad" : "");
          badge.textContent = t(share.readable === true ? "readable" : share.readable === false ? "notReadable" : "unknown");
          access.append(badge);
          access.style.textAlign = "right";
          row.append(name, access);
          return row;
        });
        $("shares").replaceChildren(...rows);
        $("howto").hidden = !state.shares.some((share) => share.readable !== true);

        $("testBadge").hidden = !state.testMode;
        if (!editingTest) {
          $("testEnabled").checked = state.testMode;
          // Settings are shown with ":", as in Arcanist's settings; they are saved with "__", as variables.
          $("variables").replaceChildren(...state.variables.map((v) => variableRow(v.key.replaceAll("__", ":"), v.value)));
          if (!state.variables.length) $("variables").append(variableRow("", ""));
          $("testEditor").hidden = !state.testMode;
        }
      }

      function variableRow(key, value) {
        const row = document.createElement("tr");
        const keyInput = Object.assign(document.createElement("input"), { value: key, placeholder: t("keyPlaceholder"), spellcheck: false });
        keyInput.setAttribute("list", "knownKeys");
        const valueInput = Object.assign(document.createElement("input"), { value, placeholder: t("valuePlaceholder"), spellcheck: false });
        const remove = Object.assign(document.createElement("button"), { type: "button", textContent: t("remove") });
        remove.addEventListener("click", () => {
          editingTest = true;
          row.remove();
          if (!$("variables").children.length) $("variables").append(variableRow("", ""));
        });
        const cells = [keyInput, valueInput, remove].map((element) => {
          const cell = document.createElement("td");
          cell.append(element);
          return cell;
        });
        row.append(...cells);
        return row;
      }

      async function post(fields) {
        const response = await fetch("api.cgi", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-Arcanist-Window": "1",
            "X-SYNO-TOKEN": token,
          },
          body: new URLSearchParams(fields),
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error || "failed");
        return body;
      }

      $("savePort").addEventListener("click", async () => {
        $("savePort").disabled = true;
        $("portState").textContent = "";
        try {
          const result = await post({ action: "port", port: $("port").value.trim() });
          $("portState").textContent = t("portSaved", { p: result.port });
          setTimeout(load, 4000);
        } catch (error) {
          $("portState").textContent = t(error.message);
        } finally {
          $("savePort").disabled = false;
        }
      });

      $("testEnabled").addEventListener("change", () => {
        editingTest = true;
        $("testEditor").hidden = !$("testEnabled").checked;
      });
      $("variables").addEventListener("input", () => (editingTest = true));
      $("addVariable").addEventListener("click", () => {
        editingTest = true;
        const row = variableRow("", "");
        $("variables").append(row);
        row.querySelector("input").focus();
      });

      // The variables go as text, one KEY=value per line (api.cgi checks and saves them).
      $("saveTest").addEventListener("click", async () => {
        const rows = [...$("variables").children]
          .map((row) => [...row.querySelectorAll("input")])
          .filter(([key, value]) => key.value.trim() || value.value.trim());
        for (const [key] of rows) key.classList.remove("invalid");
        $("saveTest").disabled = true;
        $("testState").textContent = "";
        try {
          const response = await fetch(`api.cgi?action=environment&enabled=${$("testEnabled").checked ? 1 : 0}`, {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "text/plain; charset=utf-8", "X-Arcanist-Window": "1", "X-SYNO-TOKEN": token },
            body: rows.map(([key, value]) => `${key.value.trim()}=${value.value.trim()}`).join("\n"),
          });
          const body = await response.json().catch(() => ({}));
          if (!response.ok) {
            if (body.line) rows[body.line - 1]?.[0].classList.add("invalid");
            $("testState").textContent = t(body.error || "failed", { k: body.key });
            return;
          }
          editingTest = false;
          $("testState").textContent = t(body.restarted ? "testSavedRestart" : "testSaved");
          setTimeout(load, body.restarted ? 4000 : 0);
        } catch {
          $("testState").textContent = t("failed");
        } finally {
          $("saveTest").disabled = false;
        }
      });

      $("restart").addEventListener("click", async () => {
        $("restart").disabled = true;
        try {
          await post({ action: "restart" });
          setTimeout(load, 4000);
        } catch (error) {
          fail(error.message);
          $("restart").disabled = false;
        }
      });

      // Opens Control Panel > Shared Folder in DSM (this page is in a DSM window, on DSM's own address).
      $("openShares").addEventListener("click", () => {
        try {
          window.top.SYNO.SDS.AppLaunch("SYNO.SDS.AdminCenter.Application", { fn: "SYNO.SDS.AdminCenter.Share.Main" });
        } catch {
          window.open("/?launchApp=SYNO.SDS.AdminCenter.Application&launchParam=" +
            encodeURIComponent("fn=SYNO.SDS.AdminCenter.Share.Main"), "_blank");
        }
      });

      // ── Logs ──────────────────────────────────────────────────────────────
      // Reads a log in pieces (api.cgi sends the bytes after an offset) and keeps following it while the tab is open.
      // Serilog's lines say their level ([INF], [WRN]…); the lines after one without it (an exception's stack trace)
      // take the same level, so filtering keeps them together. The supervisor's own lines start with a date.
      const MAX_LINES = 5000;
      const LEVELS = { VRB: 0, DBG: 1, INF: 2, WRN: 3, ERR: 4, FTL: 5 };
      const levelPattern = /\[(?:\d\d:\d\d:\d\d(?:\.\d+)? )?(VRB|DBG|INF|WRN|ERR|FTL)\]/;
      const supervisorPattern = /^\w{3} \w{3} +\d+ \d\d:\d\d:\d\d/;
      const log = { file: "latest", name: null, end: null, size: 0, decoder: null, rest: "", lines: [], timer: null, busy: false };

      function logRequest(params) {
        return fetch("api.cgi?" + new URLSearchParams({ action: "log", ...params }), {
          cache: "no-store",
          credentials: "same-origin",
          headers: { "X-SYNO-TOKEN": token },
        });
      }

      function lineClass(level) {
        return level >= 4 ? "l-error" : level === 3 ? "l-warn" : level <= 1 ? "l-debug" : "";
      }

      function visible(line) {
        const search = $("logSearch").value.trim().toLowerCase();
        return line.level >= Number($("logLevel").value) && (!search || line.text.toLowerCase().includes(search));
      }

      function lineNode(line) {
        const node = document.createElement("div");
        node.textContent = line.text || " ";
        node.className = lineClass(line.level);
        return node;
      }

      function showEmpty() {
        if ($("logView").children.length) return;
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = t("logEmpty");
        $("logView").append(empty);
      }

      function renderLog() {
        const nodes = [];
        for (const line of log.lines) {
          line.node = visible(line) ? lineNode(line) : null;
          if (line.node) nodes.push(line.node);
        }
        $("logView").replaceChildren(...nodes);
        if (!nodes.length) showEmpty();
        $("logView").scrollTop = $("logView").scrollHeight;
        logInfo();
      }

      function logInfo() {
        $("logInfo").textContent = log.name ? t("logShown", { f: log.name, s: size(log.size), n: log.lines.length }) : "";
      }

      function resetLog() {
        log.end = null;
        log.name = null;
        log.rest = "";
        log.lines = [];
        log.decoder = new TextDecoder();
        $("logView").replaceChildren();
      }

      // Adds text to the log; the last line waits until it is complete. dropFirst: the text starts mid-line.
      function appendLog(text, dropFirst) {
        const view = $("logView");
        const atBottom = view.scrollTop + view.clientHeight >= view.scrollHeight - 30;
        const parts = (log.rest + text).split("\n");
        log.rest = parts.pop();
        if (dropFirst) parts.shift();
        view.querySelector(".empty")?.remove();
        let previous = log.lines.at(-1)?.level ?? 2;
        for (let part of parts) {
          part = part.replace(/\r$/, "").replace(/\x1b\[[0-9;]*m/g, "");
          const match = levelPattern.exec(part.slice(0, 64));
          const level = match ? LEVELS[match[1]] : supervisorPattern.test(part) ? 2 : previous;
          previous = level;
          const line = { text: part, level, node: null };
          if (visible(line)) {
            line.node = lineNode(line);
            view.append(line.node);
          }
          log.lines.push(line);
        }
        for (const old of log.lines.splice(0, Math.max(0, log.lines.length - MAX_LINES))) old.node?.remove();
        if (!view.children.length) showEmpty();
        if (atBottom) view.scrollTop = view.scrollHeight;
        logInfo();
      }

      // Reads what the log has after what is shown (all of it, in pieces), or its end the first time.
      async function readLog() {
        if (log.busy) return;
        log.busy = true;
        try {
          for (let pieces = 0; pieces < 20; pieces++) {
            const response = await logRequest(log.end === null ? { file: log.file } : { file: log.file, offset: log.end });
            if (!response.ok) {
              const body = await response.json().catch(() => ({}));
              resetLog();
              const message = document.createElement("div");
              message.className = "empty";
              message.textContent = t(body.error || "failed");
              $("logView").append(message);
              return;
            }
            const name = response.headers.get("X-Log-File");
            const start = Number(response.headers.get("X-Log-Offset"));
            const end = Number(response.headers.get("X-Log-End"));
            const bytes = await response.arrayBuffer();
            // The newest log is another file (a new day), or this one was cut: read it again from the start.
            if (log.name !== null && (name !== log.name || start !== log.end)) {
              resetLog();
              log.end = 0;
              log.name = name;
              continue;
            }
            const first = log.end === null;
            log.name = name;
            log.size = Number(response.headers.get("X-Log-Size"));
            appendLog(log.decoder.decode(bytes, { stream: true }), first && start > 0);
            log.end = end;
            if (end >= log.size) break;
          }
        } catch {
          // The next round tries again.
        } finally {
          log.busy = false;
        }
      }

      function followLog() {
        clearTimeout(log.timer);
        if ($("logs").hidden || !$("logFollow").checked) return;
        log.timer = setTimeout(async () => {
          await readLog();
          followLog();
        }, 2000);
      }

      async function loadLogFiles() {
        const response = await fetch("api.cgi?action=logs", {
          cache: "no-store",
          credentials: "same-origin",
          headers: { "X-SYNO-TOKEN": token },
        }).catch(() => null);
        const body = response?.ok ? await response.json().catch(() => null) : null;
        const options = [new Option(t("logLatest"), "latest")];
        for (const file of body?.logs ?? []) {
          if (file.kind === "package") {
            options.push(new Option(t("logPackage"), file.file));
          } else {
            const [, y, m, d] = /(\d{4})(\d\d)(\d\d)/.exec(file.file);
            const date = new Date(Number(y), Number(m) - 1, Number(d)).toLocaleDateString(lang);
            options.push(new Option(t("logOf", { d: date }), file.file));
          }
        }
        $("logFile").replaceChildren(...options);
        $("logFile").value = options.some((option) => option.value === log.file) ? log.file : "latest";
      }

      async function openLog(file) {
        log.file = file;
        resetLog();
        await readLog();
        followLog();
      }

      function showTab(logs) {
        $("tabGeneral").setAttribute("aria-selected", String(!logs));
        $("tabLogs").setAttribute("aria-selected", String(logs));
        $("general").hidden = logs;
        $("logs").hidden = !logs;
        if (logs) {
          loadLogFiles();
          openLog(log.file);
        } else {
          clearTimeout(log.timer);
        }
      }

      $("tabGeneral").addEventListener("click", () => showTab(false));
      $("tabLogs").addEventListener("click", () => showTab(true));
      $("logFile").addEventListener("change", () => openLog($("logFile").value));
      $("logLevel").addEventListener("change", renderLog);
      $("logSearch").addEventListener("input", renderLog);
      $("logFollow").addEventListener("change", async () => {
        if ($("logFollow").checked) await readLog();
        followLog();
      });

      // The whole file, in pieces, saved with its name.
      $("logDownload").addEventListener("click", async () => {
        $("logDownload").disabled = true;
        try {
          const pieces = [];
          let offset = 0, name = null, total = 0;
          do {
            const response = await logRequest({ file: log.name ?? log.file, offset });
            if (!response.ok) throw new Error();
            name = response.headers.get("X-Log-File");
            total = Number(response.headers.get("X-Log-Size"));
            pieces.push(await response.blob());
            offset = Number(response.headers.get("X-Log-End"));
          } while (offset < total);
          const link = Object.assign(document.createElement("a"), {
            href: URL.createObjectURL(new Blob(pieces, { type: "text/plain" })),
            download: name,
          });
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(link.href), 10000);
        } catch {
          $("logInfo").textContent = t("failed");
        } finally {
          $("logDownload").disabled = false;
        }
      });

      translate();
      load();
      setInterval(load, 15000);
    </script>
  </body>
</html>
