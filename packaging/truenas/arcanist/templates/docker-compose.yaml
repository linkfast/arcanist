{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.arcanist_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perm_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{# The image has bash but no curl, wget or nc #}
{% do c1.healthcheck.set_test("http", {"port": values.network.web_port.port_number, "path": "/health"}) %}
{% do c1.healthcheck.set_start_period(60) %}

{% do c1.environment.add_env("ARCANIST_DATA_DIR", values.consts.data_path) %}
{# appsettings.json listens on 8484; the unprefixed Urls key overrides it (ASPNETCORE_URLS does not) #}
{% do c1.environment.add_env("Urls", "http://*:" ~ values.network.web_port.port_number) %}
{# Tells the admin panel how this server is updated #}
{% do c1.environment.add_env("ARCANIST_INSTALL_KIND", "TRUE_NAS") %}

{% do c1.environment.add_user_envs(values.arcanist.additional_envs) %}

{% if values.arcanist.server_audio %}
  {% do c1.add_snd_device() %}
{% endif %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perm_config) %}

{% do c1.add_storage(values.consts.music_path, values.storage.music) %}
{% do perm_container.add_or_skip_action("music", values.storage.music, perm_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perm_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.notes.add_info("On first start Arcanist prints a setup code in the app logs (also saved as setup-code.txt in the data storage). The setup wizard asks for it when opened from another device.") %}
{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
