<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Arcanist</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // The theme before the app starts, so the page does not flash the other one (see core/theme/theme.ts).
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('arcanist.theme');
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
